<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 500" width="200" height="160">
  <!-- Location Pin -->
  <path d="M 326 480 C 326 480 220 380 220 280 C 220 200 270 150 326 150 C 382 150 432 200 432 280 C 432 380 326 480 326 480 Z" fill="black" stroke="black" stroke-width="2"/>
  
  <!-- Car Body -->
  <ellipse cx="326" cy="240" rx="95" ry="70" fill="#DC143C"/>
  
  <!-- Car Windows -->
  <rect x="290" y="210" width="35" height="25" fill="#87CEEB" rx="3"/>
  <rect x="330" y="210" width="40" height="25" fill="#87CEEB" rx="3"/>
  
  <!-- Car Details - Front -->
  <circle cx="305" cy="235" r="4" fill="#333"/>
  <circle cx="315" cy="235" r="4" fill="#333"/>
  <circle cx="325" cy="235" r="4" fill="#333"/>
  
  <!-- Front Lights -->
  <circle cx="290" cy="250" r="3" fill="#FFD700"/>
  <circle cx="362" cy="250" r="3" fill="#FFD700"/>
  
  <!-- Wheels outside the pin -->
  <circle cx="290" cy="295" r="25" fill="black" stroke="white" stroke-width="3"/>
  <circle cx="362" cy="295" r="25" fill="black" stroke="white" stroke-width="3"/>
  
  <!-- Wheel Rims -->
  <circle cx="290" cy="295" r="15" fill="#555" stroke="white" stroke-width="1"/>
  <circle cx="362" cy="295" r="15" fill="#555" stroke="white" stroke-width="1"/>
  
  <!-- Text: RENTAL -->
  <text x="420" y="280" font-size="60" font-weight="bold" font-family="Arial, sans-serif" fill="black" letter-spacing="2">RENTAL</text>
  
  <!-- Text: CAR -->
  <text x="420" y="350" font-size="60" font-weight="bold" font-family="Arial, sans-serif" fill="#DC143C" letter-spacing="2">CAR</text>
</svg>